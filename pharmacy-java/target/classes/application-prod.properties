# Hồ sơ chạy thật trên mạng (SPRING_PROFILES_ACTIVE=prod). Database là PostgreSQL qua biến DATABASE_URL,
# KHÔNG dùng file H2 vì ổ đĩa của dịch vụ cloud bị xóa mỗi lần khởi động lại.
spring.h2.console.enabled=false
spring.jpa.hibernate.ddl-auto=update
spring.thymeleaf.cache=true

# Chạy sau proxy HTTPS của nhà cung cấp: nhận đúng địa chỉ/giao thức thật
server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax
server.shutdown=graceful

# Database serverless (Neon...) tự ngủ khi rảnh: không giữ kết nối rảnh quá lâu, chờ được khi đang đánh thức
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.initialization-fail-timeout=30000
spring.datasource.hikari.connection-timeout=20000

# Không tạo dữ liệu mẫu trên hệ thống thật (tự bật lại bằng biến môi trường nếu muốn demo)
pharmacy.seed-demo-user=${SEED_DEMO_USER:false}
