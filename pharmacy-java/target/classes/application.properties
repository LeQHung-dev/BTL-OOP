server.port=${PORT:8080}
# Dữ liệu lưu CỐ ĐỊNH tại thư mục người dùng (mặc định ~/.pharmascan), không phụ thuộc thư mục đang chạy lệnh.
# Đổi nơi lưu bằng biến môi trường PHARMACY_DATA_DIR. Sao lưu = chép file pharmacy.mv.db trong thư mục đó.
spring.datasource.url=jdbc:h2:file:${PHARMACY_DATA_DIR:${user.home}/.pharmascan}/pharmacy;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
# Mặc định TẮT vì console đăng nhập bằng sa/không mật khẩu. Bật khi cần: H2_CONSOLE=true
spring.h2.console.enabled=${H2_CONSOLE:false}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.thymeleaf.cache=false

# Đọc đơn thuốc: provider = auto | openai | gemini. Để trống khóa = dùng dữ liệu mẫu.
pharmacy.ocr.provider=${OCR_PROVIDER:gemini}
pharmacy.openai.api-key=${OPENAI_API_KEY:}
pharmacy.openai.model=${OPENAI_MODEL:gpt-4o}

# Gemini: GEMINI_MODEL là danh sách mô hình cách nhau dấu phẩy (đầu = chính, sau = dự phòng khi quá tải).
# Khóa Gemini: dán vào đây hoặc đặt biến môi trường GEMINI_API_KEY. Để trống = dùng dữ liệu mẫu.
pharmacy.gemini.api-key=${GEMINI_API_KEY:}
pharmacy.gemini.model=${GEMINI_MODEL:gemini-3.5-flash-lite,gemini-3.5-flash}
# Mô hình chính chậm quá số mili-giây này thì gọi mô hình dự phòng song song (lấy kết quả về trước). 0 = chạy cả hai cùng lúc ngay từ đầu.
pharmacy.gemini.hedge-ms=${GEMINI_HEDGE_MS:6000}
# Gửi kèm danh mục thuốc cho AI để đọc chữ khó chính xác hơn. Tắt (false) nếu muốn đọc nhanh hơn một chút.
pharmacy.ocr.catalog-hints=${OCR_CATALOG_HINTS:true}

# Tài khoản nhận chuyển khoản (VietQR)
pharmacy.bank.id=${BANK_ID:970422}
pharmacy.bank.account-no=${BANK_ACCOUNT_NO:0123456789}
pharmacy.bank.account-name=${BANK_ACCOUNT_NAME:NHA THUOC DEMO}

# Tài khoản mẫu tạo lần đầu (ĐỔI MẬT KHẨU khi dùng thật)
pharmacy.admin.username=${ADMIN_USER:admin}
pharmacy.admin.password=${ADMIN_PASSWORD:admin123}

# Dữ liệu mẫu: bổ sung 100 thuốc còn thiếu mỗi lần chạy; tài khoản dược sĩ mẫu (duocsi) chỉ tạo khi DB trống.
# Khi dùng thật: đặt SEED_MEDICINES=false, SEED_DEMO_USER=false.
pharmacy.seed-medicines=${SEED_MEDICINES:true}
pharmacy.seed-demo-user=${SEED_DEMO_USER:true}
